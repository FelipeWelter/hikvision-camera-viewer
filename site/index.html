<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>Monitoramento de Câmeras</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Monitoramento de Câmeras</h1>
      <p>Visualização Hikvision</p>
    </div>

    <div class="header-actions">
      <div class="live-indicator"><span></span> Sistema online</div>
      <button id="refreshBtn" type="button">Atualizar</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Buscar câmera..." autocomplete="off" />
      <select id="gridSelect" aria-label="Quantidade de colunas">
        <option value="1">1 coluna</option>
        <option value="2" selected>2 colunas</option>
        <option value="3">3 colunas</option>
        <option value="4">4 colunas</option>
      </select>
      <div class="counter"><strong id="onlineCount">0</strong>/<span id="totalCount">0</span> câmeras</div>
    </section>

    <section id="cameraGrid" class="camera-grid cols-2"></section>
  </main>

  <div id="emptyState" class="empty hidden">
    Nenhuma câmera encontrada.
  </div>

  <script src="config/cameras.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
